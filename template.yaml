AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Blueberry Pancake - Backend (API, Lambda, DynamoDB)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment
  JwtSecret:
    Type: String
    NoEcho: true
    Description: JWT signing secret (use AWS Secrets Manager for production)
  ResendApiKey:
    Type: String
    NoEcho: true
    Description: Resend API key for email sending
  RootAdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated list of root admin email addresses
  FrontendDomain:
    Type: String
    Default: "placeholder"
    Description: CloudFront domain for CORS. After frontend stack deploy, update with FrontendUrl domain and redeploy.
  EmailFromAddress:
    Type: String
    Default: "noreply@example.com"
    Description: Sender email address for Resend (must be verified in Resend)
  CsrfSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: CSRF secret for XSRF token generation (required when XsrfEnabled=true; generate with openssl rand -base64 32)
  XsrfEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable XSRF protection for state-changing requests

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        DYNAMODB_TABLE: !Ref DataTable
        JWT_SECRET: !Ref JwtSecret
        RESEND_API_KEY: !Ref ResendApiKey
        ROOT_ADMIN_EMAILS: !Ref RootAdminEmails
        FRONTEND_ORIGIN: !Sub "https://${FrontendDomain}"
        EMAIL_FROM_ADDRESS: !Ref EmailFromAddress
        XSRF_ENABLED: !Ref XsrfEnabled
        CSRF_SECRET: !Ref CsrfSecret

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDomain}"
          - "http://localhost:5173"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-CSRF-Token
        AllowCredentials: true

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blueberry-pancake-${Environment}"
      CodeUri: backend/
      Handler: src/lambda.handler
      Description: Blueberry Pancake backend API
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DataTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
    Metadata:
      BuildMethod: makefile

  DataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "blueberry-pancake-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: blueberry-pancake

  WarmupSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "blueberry-pancake-warmup-${Environment}"
      Description: Keep Lambda warm to reduce cold starts
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: "rate(5 minutes)"
      Target:
        Arn: !GetAtt BackendFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"warmup": true}'

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BackendFunction.Arn

Outputs:
  ApiId:
    Description: API Gateway HTTP API ID
    Value: !Ref HttpApi
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref DataTable
