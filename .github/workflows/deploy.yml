name: Deploy to AWS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '22'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Setup DynamoDB Local Table
        run: npm run dynamo:setup
        working-directory: backend
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_TABLE: blueberry-pancake-test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local

      - name: Run backend tests
        run: npm run test:run
        working-directory: backend
        env:
          NODE_ENV: test
          DYNAMODB_ENDPOINT: http://localhost:8000
          DYNAMODB_TABLE: blueberry-pancake-test
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: local
          AWS_SECRET_ACCESS_KEY: local
          JWT_SECRET: test-jwt-secret

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:run
        working-directory: frontend
        continue-on-error: false

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  deploy-backend:
    name: Deploy Backend
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: SAM Build
        run: sam build --use-container

      - name: SAM Deploy Backend
        id: deploy-backend
        run: |
          sam deploy \
            --config-env ${{ github.event.inputs.environment || 'prod' }} \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              JwtSecret=${{ secrets.JWT_SECRET }} \
              ResendApiKey=${{ secrets.RESEND_API_KEY }} \
              RootAdminEmails=${{ secrets.ROOT_ADMIN_EMAILS }} \
              CsrfSecret=${{ secrets.CSRF_SECRET }} \
              EmailFromAddress=${{ secrets.EMAIL_FROM_ADDRESS }} \
              TurnstileSecretKey=${{ secrets.TURNSTILE_SECRET_KEY }} \
              XsrfEnabled=true \
              FrontendDomain=placeholder
          echo "api_id=$(aws cloudformation describe-stacks --stack-name blueberry-pancake-${{ github.event.inputs.environment || 'prod' }} --query 'Stacks[0].Outputs[?OutputKey==`ApiId`].OutputValue' --output text)" >> $GITHUB_OUTPUT

      - name: Deploy Frontend Stack
        run: |
          sam deploy \
            --template-file template-frontend.yaml \
            --stack-name blueberry-pancake-frontend-${{ github.event.inputs.environment || 'prod' }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              ApiId=${{ steps.deploy-backend.outputs.api_id }} \
              Environment=${{ github.event.inputs.environment || 'prod' }}

      - name: Update Backend CORS
        run: |
          FRONTEND_URL=$(aws cloudformation describe-stacks --stack-name blueberry-pancake-frontend-${{ github.event.inputs.environment || 'prod' }} --query 'Stacks[0].Outputs[?OutputKey==`FrontendUrl`].OutputValue' --output text)
          FRONTEND_DOMAIN=$(echo "$FRONTEND_URL" | sed 's|https://||' | sed 's|/.*||')
          sam deploy \
            --config-env ${{ github.event.inputs.environment || 'prod' }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              JwtSecret=${{ secrets.JWT_SECRET }} \
              ResendApiKey=${{ secrets.RESEND_API_KEY }} \
              RootAdminEmails=${{ secrets.ROOT_ADMIN_EMAILS }} \
              CsrfSecret=${{ secrets.CSRF_SECRET }} \
              EmailFromAddress=${{ secrets.EMAIL_FROM_ADDRESS }} \
              TurnstileSecretKey=${{ secrets.TURNSTILE_SECRET_KEY }} \
              XsrfEnabled=true \
              FrontendDomain=$FRONTEND_DOMAIN \
              FrontendDomainCloudFront=$FRONTEND_DOMAIN

  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsDeployment
          aws-region: ${{ env.AWS_REGION }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Get stack outputs
        id: stack-outputs
        run: |
          STACK_NAME="blueberry-pancake-frontend-${{ github.event.inputs.environment || 'prod' }}"
          echo "bucket=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue' --output text)" >> $GITHUB_OUTPUT
          echo "distribution=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`CloudFrontDistributionId`].OutputValue' --output text)" >> $GITHUB_OUTPUT
          echo "url=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs[?OutputKey==`FrontendUrl`].OutputValue' --output text)" >> $GITHUB_OUTPUT

      - name: Sync to S3
        run: |
          # Sync assets with long cache
          aws s3 sync frontend/dist/ s3://${{ steps.stack-outputs.outputs.bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.json"
          
          # Sync HTML and JSON with short cache
          aws s3 sync frontend/dist/ s3://${{ steps.stack-outputs.outputs.bucket }}/ \
            --cache-control "public, max-age=60" \
            --exclude "*" \
            --include "index.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack-outputs.outputs.distribution }} \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'prod' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend URL:** ${{ steps.stack-outputs.outputs.url }}" >> $GITHUB_STEP_SUMMARY
