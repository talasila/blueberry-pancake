# DynamoDB Local for local development and testing
# Usage:
#   docker compose up -d      # Start DynamoDB Local
#   docker compose down       # Stop and remove containers
#   rm -rf data/dynamodb/*    # Clear DynamoDB data (if needed)

services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: blueberry-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - ./data/dynamodb:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: blueberry-dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    depends_on:
      dynamodb-local:
        condition: service_healthy
