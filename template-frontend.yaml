AWSTemplateFormatVersion: '2010-09-09'
Description: Blueberry Pancake - Frontend (S3, CloudFront)

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment
  ApiId:
    Type: String
    Description: API Gateway HTTP API ID (from backend stack ApiId output)

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "blueberry-pancake-frontend-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: blueberry-pancake

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "blueberry-pancake-oac-${Environment}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Function that rewrites SPA paths to /index.html.
  # Only fires on the default (S3) cache behavior, so API responses are never touched.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "blueberry-pancake-spa-rewrite-${Environment}"
      AutoPublish: true
      FunctionConfig:
        Comment: "Rewrite non-file SPA paths to /index.html for client-side routing"
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          // If the URI has a file extension (e.g. .js, .css, .png, .json), let it through
          if (uri.includes('.')) {
            return request;
          }
          // Rewrite everything else to index.html for React Router
          request.uri = '/index.html';
          return request;
        }

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
          - Id: ApiOrigin
            DomainName: !Sub "${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Environment}"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          # API behavior: no caching, forward all cookies/headers for auth
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            # CachingDisabled — no caching, Set-Cookie responses pass through to viewer
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards ALL cookies (jwt_token, refresh_token,
            # csrfSecret) and headers (Authorization, X-CSRF-Token) to API Gateway origin
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: blueberry-pancake

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  FrontendUrl:
    Description: CloudFront Distribution URL
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Description: S3 Bucket for frontend files
    Value: !Ref FrontendBucket
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID (for cache invalidation)
    Value: !Ref FrontendDistribution
